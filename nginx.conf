server {
    listen 80;
    server_name localhost;

    # Gzip para optimizar transferencia de estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Enrutamiento de React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el Backend FastAPI
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        # Headers estándar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuración esencial para Server-Sent Events (SSE / Streaming en tiempo real)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Tamaño máximo de archivos subidos (ej: PDFs grandes de 50MB)
        client_max_body_size 50M;
    }
}
