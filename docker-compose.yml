services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: policylens_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./sql_app.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-phi4-mini}
      - EMBEDDING_MODEL_LOCAL=${EMBEDDING_MODEL_LOCAL:-intfloat/multilingual-e5-base}
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./documents:/app/documents
      - ./sql_app.db:/app/sql_app.db
      - hf_cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: policylens_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hf_cache:
    name: policylens_hf_cache
